name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Publish ghcr.io/perruer/yapix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          image=ghcr.io/perruer/yapix
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label org.opencontainers.image.source=https://github.com/Perruer/yapix \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            --label org.opencontainers.image.version="$version" \
            -t "$image:$version" -t "$image:latest" --push .

  github-release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pack the browser extension
        run: node scripts/pack-extension.js
      - name: Create the draft with notes from docs/releases/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" --draft --title "Yapix ${GITHUB_REF_NAME#v}" --notes-file "$notes" \
            static/attachment/yapix-request-helper.zip
